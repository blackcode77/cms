server {
    listen 80 default_server;
    server_name _;

    # Image uploads (the app limits them to 5 MB, see docker/php/uploads.ini)
    client_max_body_size 8m;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Uploaded images, written by the backend into the shared "uploads" volume
    location /uploads/ {
        alias /app/uploads/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend API (Yii3): single entry point public/index.php
    location /api/ {
        root /app/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # Overwrites any client-supplied value: the app trusts X-Real-IP for rate limiting (see ClientIp).
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass php:9000;
    }

    # Frontend (Nuxt SSR + static assets served by the Nitro server)
    location / {
        proxy_pass http://node:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
