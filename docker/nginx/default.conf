server {
    listen 80;
    server_name cms.localhost localhost;

    # Uploads: images up to 5 MB, Documents up to 20 MB (the app checks, see docker/php/uploads.ini)
    client_max_body_size 22m;

    # Uploaded images, written by the backend into backend/storage/uploads
    # Uploaded Documents: always downloaded (never rendered on our origin), under their cleaned original name
    location /uploads/files/ {
        alias /app/uploads/files/;
        add_header X-Content-Type-Options nosniff;
        add_header Content-Disposition attachment;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        alias /app/uploads/;
        add_header X-Content-Type-Options nosniff;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Backend API (Yii3): single entry point public/index.php
    location /api/ {
        root /app/public;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        # Overwrites any client-supplied value: the app trusts X-Real-IP for rate limiting (see ClientIp).
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_pass php:9000;
    }

    # Frontend (Nuxt SSR) incl. HMR websocket
    location / {
        proxy_pass http://node:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
