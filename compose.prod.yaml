# Production stack. Deployed with `make deploy-prod`; secrets come from the server's .env (never committed).
# Differences from compose.yaml: no bind-mounted code, no dev tools (Mailpit, Xdebug, HMR), no published DB port.
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  php:
    image: cms-prod-php
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    restart: unless-stopped
    working_dir: /app
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_TEST_NAME: app_test
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAIL_FROM: ${MAIL_FROM:-cms@localhost}
    volumes:
      - uploads:/app/storage/uploads
      - runtime:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy

  node:
    image: cms-prod-node
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL_URL: http://nginx/api
      NUXT_PUBLIC_API_BASE: /api

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/app/public:ro
      - uploads:/app/uploads:ro
    depends_on:
      - php
      - node

volumes:
  pgdata:
  uploads:
  runtime:
